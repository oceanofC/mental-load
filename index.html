<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EBEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111715" media="(prefers-color-scheme: dark)">
<meta name="description" content="See the work. Share the work. A shared household app for chores and routines.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mental Load</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&display=swap">
<style>
/* Layout: one calm column (max 36rem) with a fixed bottom tab bar for one-handed use.
   Every life area carries its own hue, like a colour-coded fridge chart; the neutrals stay quiet. */
:root{
  --bg:#EBEFEC; --surface:#F9FBFA; --sunk:#E0E6E2; --ink:#16201C; --muted:#56645F; --line:#D1D9D4;
  --on-ink:#F4F7F5; --focus:#2C6C9E;
  --nudge:#83560A; --nudge-s:#F3E5C4;
  --brass:#8F6311; --brass-s:#F0E3C0;
  --shadow:0 1px 0 rgba(22,32,28,.05), 0 10px 26px -18px rgba(22,32,28,.45);
  --scrim:rgba(14,20,18,.42);

  --h-teal:#1D7472; --h-teal-s:#D3E9E7;
  --h-plum:#8B3D77; --h-plum-s:#EFDBE9;
  --h-sky:#2B6A9C; --h-sky-s:#D9E6F1;
  --h-tomato:#AE4731; --h-tomato-s:#F3DED7;
  --h-mustard:#86650F; --h-mustard-s:#F0E5C2;
  --h-leaf:#3B7634; --h-leaf-s:#DAE9D1;
  --h-flame:#B45A22; --h-flame-s:#F5E0D0;
  --h-lavender:#6556A3; --h-lavender-s:#E3DFF2;
  --h-bark:#76563A; --h-bark-s:#ECE2D6;
  --h-slate:#4A5C71; --h-slate-s:#DEE4EA;
  --h-rose:#AA3B5B; --h-rose-s:#F4D9E1;

  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --fs-xs:.78rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.125rem; --fs-xl:1.4rem; --fs-2xl:1.85rem; --fs-3xl:2.4rem;
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --tabbar:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111715; --surface:#19211E; --sunk:#222C28; --ink:#E5ECE8; --muted:#9BABA4; --line:#2D3833;
    --on-ink:#111715; --focus:#86BCE8;
    --nudge:#E7B65A; --nudge-s:#352A15;
    --brass:#E2B456; --brass-s:#342A16;
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 10px 26px -18px rgba(0,0,0,.8);
    --scrim:rgba(0,0,0,.6);
    --h-teal:#6ACBC6; --h-teal-s:#163230;
    --h-plum:#DC92C8; --h-plum-s:#372233;
    --h-sky:#80B4E1; --h-sky-s:#1C2C3A;
    --h-tomato:#EC957F; --h-tomato-s:#3A231D;
    --h-mustard:#DBB956; --h-mustard-s:#332B16;
    --h-leaf:#8CC57F; --h-leaf-s:#1E301E;
    --h-flame:#EFA06A; --h-flame-s:#392617;
    --h-lavender:#B2A5EC; --h-lavender-s:#29253F;
    --h-bark:#CDA882; --h-bark-s:#32281E;
    --h-slate:#A4B5C9; --h-slate-s:#252D36;
    --h-rose:#EC92AC; --h-rose-s:#391F28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211E; --sunk:#222C28; --ink:#E5ECE8; --muted:#9BABA4; --line:#2D3833;
  --on-ink:#111715; --focus:#86BCE8;
  --nudge:#E7B65A; --nudge-s:#352A15;
  --brass:#E2B456; --brass-s:#342A16;
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 10px 26px -18px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.6);
  --h-teal:#6ACBC6; --h-teal-s:#163230;
  --h-plum:#DC92C8; --h-plum-s:#372233;
  --h-sky:#80B4E1; --h-sky-s:#1C2C3A;
  --h-tomato:#EC957F; --h-tomato-s:#3A231D;
  --h-mustard:#DBB956; --h-mustard-s:#332B16;
  --h-leaf:#8CC57F; --h-leaf-s:#1E301E;
  --h-flame:#EFA06A; --h-flame-s:#392617;
  --h-lavender:#B2A5EC; --h-lavender-s:#29253F;
  --h-bark:#CDA882; --h-bark-s:#32281E;
  --h-slate:#A4B5C9; --h-slate-s:#252D36;
  --h-rose:#EC92AC; --h-rose-s:#391F28;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img,svg{max-width:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-md);line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
ul{list-style:none;margin:0;padding:0}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:36rem;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--tabbar) + 32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}

/* ---------- headers ---------- */
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:6px}
.wordmark{font-size:var(--fs-3xl);font-weight:800;letter-spacing:-.035em;line-height:.95}
.wordmark span{display:block}
.promise{color:var(--muted);margin-top:8px;font-size:var(--fs-md)}
.head-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.page-top{display:flex;align-items:center;gap:10px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:10px 8px 10px 0;color:var(--muted);font-size:var(--fs-sm);font-weight:700}
.back svg{width:20px;height:20px}
.page-top .spacer{flex:1}
.page-title{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.025em}
.lede{color:var(--muted)}

/* ---------- generic ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{font-size:var(--fs-xl)}
.sec-head .date,.sub{color:var(--muted);font-size:var(--fs-sm)}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-head h2{font-size:var(--fs-lg)}
.calm{color:var(--muted);padding:14px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-md)}
.foot{color:var(--muted);font-size:var(--fs-sm)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--ink);text-decoration:none}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.soft{background:var(--sunk);border-color:transparent}
.btn.danger{color:var(--h-tomato);border-color:var(--h-tomato)}
.btn.wide{width:100%}
.btn.small{min-height:38px;padding:0 14px;font-size:var(--fs-sm)}
.btn:disabled,.check:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 0;min-width:0}
.linkish{border:0;background:none;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:var(--fs-sm)}

.banner{border-radius:var(--r-md);padding:12px 14px;font-size:var(--fs-sm);background:var(--sunk);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.banner svg{width:20px;height:20px;flex-shrink:0;margin-top:1px;color:var(--muted)}
.banner.warn{background:var(--nudge-s)}
.banner.warn svg{color:var(--nudge)}

/* ---------- avatars ---------- */
.av{--c:var(--h-slate);--cs:var(--h-slate-s);width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--cs);color:var(--c);font-weight:700;font-size:.8rem;border:2px solid var(--surface);flex-shrink:0;font-family:var(--display)}
.av.lg{width:44px;height:44px;font-size:1.05rem}
.av.xl{width:56px;height:56px;font-size:1.3rem}
.avs{display:flex;flex-shrink:0}
.avs .av+.av{margin-left:-9px}
.me-btn{border:0;background:none;padding:0;border-radius:50%}
.me-btn .av{width:44px;height:44px;font-size:1rem;border-color:var(--bg)}
.me-btn .av.empty{background:var(--surface);border:1px dashed var(--line);color:var(--muted)}

/* ---------- today strip ---------- */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.strip div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.strip b{font-family:var(--display);font-size:var(--fs-2xl);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.strip span{font-size:var(--fs-xs);color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.strip .is-overdue.has b{color:var(--nudge)}
.strip .is-overdue.has{background:var(--nudge-s);border-color:transparent}
.group{display:flex;flex-direction:column;gap:6px}
.group+.group{margin-top:14px}
.group h3{font-family:var(--body);font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.group.overdue h3{color:var(--nudge)}

/* ---------- task rows ---------- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{--ac:var(--h-slate);--acs:var(--h-slate-s);display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px 8px 8px;position:relative;min-height:62px}
.row::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}
.row.is-overdue{background:var(--nudge-s);border-color:transparent}
.check{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:2px solid var(--ac);background:transparent;display:grid;place-items:center;color:var(--ac);margin-left:6px}
.check svg{width:20px;height:20px;opacity:.28}
.check:hover svg,.check:focus-visible svg{opacity:1}
.check:active{background:var(--acs)}
.row-main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0;display:flex;flex-direction:column;gap:2px}
.row-title{font-weight:700;font-size:var(--fs-md);overflow-wrap:anywhere}
.row-meta{font-size:var(--fs-sm);color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-meta .due-overdue{color:var(--nudge);font-weight:700}
.row-meta .due-now{color:var(--ink);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:700;color:var(--ac)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}

/* ---------- fairness ---------- */
.bal{display:flex;flex-direction:column;gap:7px}
.bal-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bal-label strong{font-family:var(--display);font-weight:650;font-size:var(--fs-md)}
.bal-label span{color:var(--muted);font-size:var(--fs-sm)}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px}
.bar i{display:block;height:100%;background:var(--c);min-width:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.legend li::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- reward snapshot ---------- */
.snap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);text-align:left;width:100%}
.snap>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.snap .big{font-family:var(--display);font-size:var(--fs-2xl);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--brass)}
.snap .lbl{font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.snap .val{font-weight:700;font-size:var(--fs-sm);overflow-wrap:anywhere}
.snap .badge-mini{display:flex;align-items:center;gap:6px;color:var(--brass)}
.snap .badge-mini svg{width:22px;height:22px;flex-shrink:0}

/* ---------- areas ---------- */
.area-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.area-tile{--ac:var(--h-slate);--acs:var(--h-slate-s);border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px}
.area-tile .ic{width:40px;height:40px;border-radius:12px;background:var(--acs);color:var(--ac);display:grid;place-items:center}
.area-tile .ic svg{width:24px;height:24px}
.area-tile strong{font-family:var(--display);font-weight:650;font-size:var(--fs-md);line-height:1.15}
.area-tile small{color:var(--muted);font-size:var(--fs-sm);display:block;margin-top:2px}
.area-tile small em{font-style:normal;color:var(--nudge);font-weight:700}
.area-tile.add{border-style:dashed;background:transparent;justify-content:center;align-items:center;text-align:center;color:var(--muted)}
.area-tile.add .ic{background:var(--sunk);color:var(--muted)}

.area-hero{--ac:var(--h-slate);--acs:var(--h-slate-s);background:var(--acs);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px}
.area-hero .ic{width:52px;height:52px;border-radius:16px;background:var(--surface);color:var(--ac);display:grid;place-items:center}
.area-hero .ic svg{width:30px;height:30px}
.area-hero h1{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.025em;color:var(--ink)}
.area-hero p{color:var(--ink);opacity:.8}
.area-hero .stats{font-size:var(--fs-sm);color:var(--ac);font-weight:700;opacity:1}
.starters{display:flex;flex-direction:column;gap:8px}
.starter{display:flex;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--surface);width:100%;text-align:left}
.starter span{flex:1;min-width:0}
.starter strong{display:block}
.starter small{color:var(--muted)}
.starter svg{width:22px;height:22px;color:var(--muted)}
details.archived{border-top:1px solid var(--line);padding-top:12px}
details.archived summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:var(--fs-sm);padding:6px 0}
.arch-row{display:flex;align-items:center;gap:8px;padding:8px 0;flex-wrap:wrap}
.arch-row span{flex:1;min-width:8rem;color:var(--muted)}

/* ---------- task detail ---------- */
.task-head{display:flex;flex-direction:column;gap:8px}
.task-head h1{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.task-head .note{color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0;align-items:baseline}
.facts dt{font-size:var(--fs-xs);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.facts dd .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.facts dd.overdue{color:var(--nudge)}
.facts dd small{display:block;color:var(--muted);font-weight:400}
.done-box{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.chip.plain span{padding:0 14px}
.chip input:checked+span{border-color:var(--ink);background:var(--sunk)}
.chip input:focus-visible+span{outline:2.5px solid var(--focus);outline-offset:2px}
.chip .av{border-color:transparent}
.history li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}
.history li:last-child{border-bottom:0}
.history .what{min-width:0;overflow-wrap:anywhere}
.history .when{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.history .pts{color:var(--brass);font-weight:700}
.history .skip{color:var(--muted)}

/* ---------- prompts ---------- */
.notif{display:flex;gap:12px;align-items:flex-start}
.notif .ic{width:36px;height:36px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex-shrink:0}
.notif .ic svg{width:20px;height:20px}
.notif .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.notif strong{font-size:var(--fs-sm)}
.notif p{font-size:var(--fs-sm);color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;align-self:flex-start}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:700;font-size:var(--fs-sm);color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.prompt{--ac:var(--h-slate);--acs:var(--h-slate-s);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:12px}
.prompt.is-overdue{background:var(--nudge-s);border-color:transparent}
.prompt-top{display:flex;gap:12px;align-items:flex-start}
.prompt-top .ic{width:38px;height:38px;border-radius:12px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex-shrink:0}
.prompt-top .ic svg{width:22px;height:22px}
.prompt.is-overdue .prompt-top .ic{background:var(--surface)}
.prompt-msg{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prompt-msg p{font-weight:700;overflow-wrap:anywhere}
.prompt-msg small{color:var(--muted);font-size:var(--fs-sm)}
.prompt .btn-row .btn{min-height:42px}

/* ---------- people ---------- */
.person{display:flex;flex-direction:column;gap:14px}
.person-top{display:flex;align-items:center;gap:12px}
.person-top h2{font-size:var(--fs-xl);flex:1;min-width:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats div{background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--display);font-size:var(--fs-xl);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:var(--fs-xs);color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.stats small{font-size:var(--fs-xs);color:var(--muted)}
.mini-list{display:flex;flex-wrap:wrap;gap:6px}
.mini-list button{--ac:var(--h-slate);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:var(--fs-sm);display:inline-flex;align-items:center;gap:6px;min-height:36px}
.mini-list button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac)}
.this-phone{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.this-phone .txt{flex:1;min-width:0}
.this-phone small{display:block;color:var(--muted);font-size:var(--fs-sm)}

/* ---------- rewards ---------- */
.total{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.total b{font-family:var(--display);font-size:3.2rem;font-weight:800;line-height:.9;color:var(--brass);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.total span{color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.badge{border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface)}
.badge .medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--brass-s);color:var(--brass)}
.badge .medal svg{width:26px;height:26px}
.badge strong{font-family:var(--display);font-weight:650}
.badge small{color:var(--muted);font-size:var(--fs-sm)}
.badge.locked{background:transparent;border-style:dashed}
.badge.locked .medal{background:var(--sunk);color:var(--muted)}
.streaks li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.streaks li:last-child{border-bottom:0}
.streaks .flame{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);flex-shrink:0}
.streaks .flame.on{background:var(--brass-s);color:var(--brass)}
.streaks .flame svg{width:20px;height:20px}
.streaks .txt{flex:1;min-width:0}
.streaks .txt small{display:block;color:var(--muted);font-size:var(--fs-sm)}
.streaks b{font-family:var(--display);font-size:var(--fs-xl);font-variant-numeric:tabular-nums}

/* ---------- about ---------- */
.prose{display:flex;flex-direction:column;gap:18px;max-width:62ch}
.prose h2{font-size:var(--fs-lg)}
.prose section{display:flex;flex-direction:column;gap:8px}
.prose p,.prose li{color:var(--ink)}
.prose ul{display:flex;flex-direction:column;gap:6px;padding-left:1.1em;list-style:disc}
.prose li::marker{color:var(--muted)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:36rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:700;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.tab .count{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--nudge);color:var(--surface);font-size:.68rem;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .18s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .22s cubic-bezier(.2,.8,.2,1);max-width:36rem;margin:0 auto}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:var(--fs-xl);margin-bottom:4px}
.sheet .lede{margin-bottom:14px;font-size:var(--fs-sm)}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.label{font-weight:700;font-size:var(--fs-sm)}
.field .hint{color:var(--muted);font-size:var(--fs-xs)}
.input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px}
textarea.input{min-height:72px;resize:vertical}
.input:focus{outline:none;border-color:var(--focus)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--h-tomato);font-size:var(--fs-sm);font-weight:700}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd .chip span{width:100%;justify-content:center;padding:0;min-height:44px;font-family:var(--display)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{position:relative}
.swatch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.swatch span{display:block;width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swatch input:checked+span{box-shadow:0 0 0 2.5px var(--ink)}
.swatch input:focus-visible+span{outline:2.5px solid var(--focus);outline-offset:3px}
.iconpick{display:flex;flex-wrap:wrap;gap:8px}
.iconpick .chip span{padding:0;width:46px;justify-content:center}
.iconpick svg{width:22px;height:22px}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions .btn{flex:1}
.quick{display:flex;flex-direction:column;gap:8px}
.quick .btn{justify-content:flex-start}

/* ---------- toast ---------- */
.toast-root{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + 12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.toast{pointer-events:auto;max-width:34rem;width:100%;background:var(--ink);color:var(--on-ink);border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.toast .burst{width:40px;height:40px;border-radius:50%;background:var(--c, var(--h-leaf));color:var(--surface);display:grid;place-items:center;flex-shrink:0;position:relative}
.toast .burst svg{width:22px;height:22px}
.toast .burst i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--brass);left:17px;top:17px;animation:spark .7s ease-out forwards}
.toast .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.toast .txt strong{font-size:var(--fs-sm)}
.toast .txt small{font-size:var(--fs-xs);opacity:.8}
.toast button{border:0;background:none;color:var(--on-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px}

.loading{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.loading .btn{margin-top:14px}
.setup-steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 12px 12px 14px}
.step .ic{width:38px;height:38px;border-radius:12px;background:var(--brass-s);color:var(--brass);display:grid;place-items:center;flex-shrink:0}
.step .ic svg{width:22px;height:22px}
.step .txt{flex:1;min-width:0}
.step .txt strong{display:block;font-size:var(--fs-sm)}
.step .txt small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.qr{background:#fff;border-radius:var(--r-md);padding:10px;width:184px;max-width:100%;align-self:center}
.qr svg{display:block;width:100%;height:auto}
.linkbox{font-size:var(--fs-xs);color:var(--muted);word-break:break-all;background:var(--sunk);border-radius:var(--r-sm);padding:8px 10px;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--muted);font-weight:700}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on::before{background:var(--h-leaf)}
.setup{display:flex;flex-direction:column;gap:14px}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
@keyframes pop{from{transform:translateY(10px) scale(.96);opacity:0}}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (min-width:640px){
  .wordmark span{display:inline}
  .area-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .badges{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:360px){
  .snap{grid-template-columns:1fr 1fr}
  .snap>div:last-child{grid-column:1/-1}
}

<script>
(function(){

/* =====================================================================

  box: sv('<path d="M4 7h16v3H4z"/><path d="M5.5 10v9.5h13V10"/><path d="M10 14h4"/>'),
  plate: sv('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/>'),
  calendar: sv('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'),
  scale: sv('<path d="M12 4v15M7 20h10"/><path d="M4.5 7.5h15"/><path d="M4.5 7.5L2 13.5h5zM19.5 7.5L17 13.5h5z"/><circle cx="12" cy="4" r="1"/>'),
  flame: sv('<path d="M12 21c-3.8 0-6-2.8-6-6 0-3.8 3.5-5.8 4-10.5 2.8 2 4.5 4.2 4.5 6.5 1-.8 1.5-1.8 1.7-3 1.8 2 2.8 4.3 2.8 7 0 3.2-2.2 6-7 6z"/>'),
  sun: sv('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>'),
  phone: sv('<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>'),

const AREA_ICONS = ['broom','pan','basket','leaf','pulse','lotus','paw','house','shirt','doc','bag','star'];
const HUES = ['teal','plum','sky','tomato','mustard','leaf','flame','lavender','bark','slate','rose'];
const hue = h => HUES.includes(h) ? h : 'slate';
const icon = k => I[AREA_ICONS.includes(k) ? k : 'house'];
const areaVars = a => { const h = hue(a && a.color); return `--ac:var(--h-${h});--acs:var(--h-${h}-s)`; };

/* =====================================================================
   Time helpers — task times are household wall-clock strings "YYYY-MM-DDTHH:MM"
   ===================================================================== */
const pad = n => String(n).padStart(2,'0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const localStr = d => `${dayKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function parseLocal(s){
  if(!s) return null;
  const [date, time='00:00'] = String(s).split('T');
  const [y,m,d] = date.split('-').map(Number); const [h,mi] = time.split(':').map(Number);
  return new Date(y, m-1, d, h||0, mi||0);
}
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const endOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n, d.getHours(), d.getMinutes());
const monIdx = d => (d.getDay()+6) % 7; // 0 = Monday
const startOfWeek = d => addDays(startOfDay(d), -monIdx(d));
const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();
const sameDay = (a,b) => a && b && dayKey(a) === dayKey(b);
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const WD_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const WD_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const WD_LETTER = ['M','T','W','T','F','S','S'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ordinal = n => { const s = (n%100>=11 && n%100<=13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n%10] || 'th'); return n + s; };
const fmtDate = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
function atTime(day, time){ const [h,m] = String(time||'09:00').split(':').map(Number); return new Date(day.getFullYear(), day.getMonth(), day.getDate(), h||0, m||0); }

/* =====================================================================
   Scheduling rules
   ===================================================================== */
function isScheduledOn(task, day){
  if(task.cadence === 'daily') return true;
  if(task.cadence === 'weekly') return (task.weekdays && task.weekdays.length ? task.weekdays : [0]).includes(monIdx(day));
  if(task.cadence === 'monthly'){ const dim = daysInMonth(day.getFullYear(), day.getMonth()); return day.getDate() === Math.min(task.dayOfMonth||1, dim); }
  return false;
}
// First scheduled moment on a calendar day strictly after `afterDay`.
function nextAfterDay(task, afterDay){
  const base = startOfDay(afterDay);
  if(task.cadence === 'monthly'){
    const dom = Math.max(1, Math.min(31, task.dayOfMonth||1));
    let y = base.getFullYear(), m = base.getMonth();
    for(let i=0;i<15;i++){
      const d = new Date(y, m, Math.min(dom, daysInMonth(y,m)));
      if(d > base) return atTime(d, task.time);
      m++; if(m>11){ m=0; y++; }
    }
  }
  for(let i=1;i<=8;i++){ const d = addDays(base,i); if(isScheduledOn(task,d)) return atTime(d, task.time); }
  return atTime(addDays(base,1), task.time);
}
// The first occurrence at or after `now` (used when a routine is created or its schedule changes).
function firstOccurrence(task, now){
  const today = startOfDay(now);
  if(isScheduledOn(task, today) && atTime(today, task.time) >= now) return atTime(today, task.time);
  return nextAfterDay(task, today);
}
// After done or skipped: roll to the next scheduled day after the later of the due day and today.
function rollForward(task, now){
  const occDay = startOfDay(parseLocal(task.nextDue) || now);
  const today = startOfDay(now);
  return nextAfterDay(task, occDay > today ? occDay : today);
}
function effDue(task){
  const n = parseLocal(task.nextDue); const s = parseLocal(task.snoozedUntil);
  return (s && n && s > n) ? s : n;
}
function isSnoozed(task, now){ const s = parseLocal(task.snoozedUntil); const n = parseLocal(task.nextDue); return !!(s && n && s > n && s > now); }
function statusOf(task, now){
  const e = effDue(task); if(!e) return 'upcoming';
  const today = startOfDay(now);
  if(e < today) return 'overdue';
  if(sameDay(e, now)) return e <= now ? 'now' : 'later';
  return 'upcoming';
}
function perWeek(task){
  if(task.cadence === 'daily') return 7;
  if(task.cadence === 'weekly') return (task.weekdays||[]).length || 1;
  return 12/52;
}

/* =====================================================================
   Copy helpers
   ===================================================================== */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function listNames(names){ if(names.length<=1) return names[0]||'nobody yet'; return names.slice(0,-1).join(', ') + ' and ' + names[names.length-1]; }
function plural(title){ const w = String(title).trim().split(/\s+/)[0].toLowerCase(); return /[^s]s$/.test(w) && !/(ss|us|is)$/.test(w); }
function partOfDay(d){ const h = d.getHours(); return h < 12 ? 'this morning' : h < 17 ? 'this afternoon' : 'this evening'; }
function partWord(d){ const h = d.getHours(); return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening'; }
function relDay(d, now){
  const diff = Math.round((startOfDay(d) - startOfDay(now)) / 864e5);
  if(diff === 0) return 'today'; if(diff === 1) return 'tomorrow'; if(diff === -1) return 'yesterday';
  if(diff > 1 && diff < 7) return WD_LONG[monIdx(d)];
  if(diff < -1 && diff > -7) return 'on ' + WD_LONG[monIdx(d)];
  return (diff > 0 ? '' : 'on ') + fmtDate(d);
}
function cadenceText(t){
  const at = ` at ${t.time||'09:00'}`;
  if(t.cadence === 'daily') return 'Every day' + at;
  if(t.cadence === 'weekly'){
    const wd = [...(t.weekdays||[])].sort((a,b)=>a-b);
    if(wd.length === 7) return 'Every day' + at;
    if(wd.length === 1) return `Every ${WD_LONG[wd[0]]}` + at;
    return 'Every ' + listNames(wd.map(i=>WD_SHORT[i])) + at;
  }

function dueLabel(t, now){
  const s = statusOf(t, now); const e = effDue(t);
  if(s === 'overdue'){ const n = parseLocal(t.nextDue); const r = relDay(n, now); return {cls:'due-overdue', text: r==='yesterday' ? 'Waiting since yesterday' : 'Waiting since ' + r.replace(/^on /,'')}; }
  if(s === 'now') return {cls:'due-now', text: isSnoozedEnded(t, now) ? 'Due now (after snooze)' : 'Due now · ' + fmtTime(e)};
  if(s === 'later') return {cls:'', text: (isSnoozed(t, now) ? 'Snoozed to ' : 'Today ') + fmtTime(e)};

function buildSeed(now){
  const T = startOfDay(now);
  const D = (n, hm) => atTime(addDays(T, n), hm);
  const wd = n => monIdx(addDays(T, n));
  const created = localStr(D(-30,'09:00'));
  const members = [

  const tasks = [
    {id:'t_dishes', areaId:'cleaning', title:'Dishes', note:'After dinner, pans included.', cadence:'daily', time:'20:00', assigneeIds:['m_alex'], minuteEstimate:15},
    {id:'t_vacuum', areaId:'cleaning', title:'Vacuum downstairs', note:'Hall, lounge and kitchen.', cadence:'weekly', weekdays:[wd(-2)], time:'18:00', assigneeIds:['m_alex'], minuteEstimate:25},
    {id:'t_bins', areaId:'cleaning', title:'Take bins out', note:'Collection is first thing Monday. Check which colour week it is.', cadence:'weekly', weekdays:[wd(1)], time:'20:00', assigneeIds:['m_alex','m_sam'], minuteEstimate:5},
    {id:'t_walk20', areaId:'exercise', title:'20 minute walk', note:'The lunchtime loop round the block.', cadence:'daily', time:'12:30', assigneeIds:['m_alex'], minuteEstimate:20},
    {id:'t_shop', areaId:'shopping', title:'Weekly food shop', note:'The list lives on the fridge. Bags are in the car.', cadence:'weekly', weekdays:[wd(-5)], time:'18:00', assigneeIds:['m_sam'], minuteEstimate:60},
    {id:'t_cook', areaId:'cooking', title:'Cook dinner', note:'Tuesday and Thursday are Sam\'s nights.', cadence:'weekly', weekdays:[...new Set([wd(-4), wd(-2)])].sort((a,b)=>a-b), time:'18:30', assigneeIds:['m_sam'], minuteEstimate:45},
    {id:'t_meditate', areaId:'meditation', title:'Meditation', note:'Ten minutes before anyone else is up.', cadence:'daily', time:'07:00', assigneeIds:['m_sam'], minuteEstimate:10},
    {id:'t_mow', areaId:'gardening', title:'Mow the lawn', note:'Front and back. Empty the box onto the compost.', cadence:'monthly', dayOfMonth: addDays(T,8).getDate(), time:'10:00', assigneeIds:['m_sam'], minuteEstimate:40},
    {id:'t_pots', areaId:'gardening', title:'Water the pots', note:'Balcony pots and the herbs by the door.', cadence:'weekly', weekdays:[wd(-1)], time:'19:00', assigneeIds:['m_alex','m_sam'], minuteEstimate:10},
    {id:'t_dog_am', areaId:'dog', title:'Morning dog walk', note:'Lead and bags are by the door.', cadence:'daily', time:'07:30', assigneeIds:['m_alex','m_sam'], minuteEstimate:25},
    {id:'t_dog_pm', areaId:'dog', title:'Evening dog walk', note:'The longer loop if it\'s still light.', cadence:'daily', time:'18:30', assigneeIds:['m_alex','m_sam'], minuteEstimate:30},
  ].map(t => ({weekdays:[], dayOfMonth:null, archived:false, snoozedUntil:null, createdAt:created, lastDoneAt:null, lastDoneBy:null, streak:null, ...t}));
  const log = [
    ['t_mow','m_sam',-22,'10:40','10:00'], ['t_pots','m_sam',-8,'19:20','19:00'], ['t_bins','m_alex',-6,'20:10','20:00'],
    ['t_shop','m_sam',-5,'18:20','18:00'], ['t_cook','m_sam',-4,'19:05','18:30'],
    ['t_meditate','m_sam',-2,'07:12','07:00'], ['t_dog_am','m_sam',-2,'07:50','07:30'], ['t_vacuum','m_alex',-2,'18:40','18:00'], ['t_cook','m_sam',-2,'19:10','18:30'],
    ['t_meditate','m_sam',-1,'07:08','07:00'], ['t_dog_am','m_alex',-1,'07:45','07:30'], ['t_walk20','m_alex',-1,'12:50','12:30'],
    ['t_meditate','m_sam',0,'07:15','07:00'], ['t_dog_am','m_alex',0,'08:05','07:30'], ['t_walk20','m_alex',0,'12:45','12:30'],
  ];
  const byId = Object.fromEntries(tasks.map(t => [t.id, t]));
  const completions = [];
  log.forEach(([taskId, memberId, n, at, occ], i) => {
    const atD = D(n, at); if(atD > now) return;
    const t = byId[taskId]; const occD = D(n, occ);
    completions.push({id:'c_seed_'+pad(i+1), taskId, memberId, at: atD.toISOString(), occurrence: localStr(occD), kind:'done', onTime: atD <= endOfDay(occD), points: atD <= endOfDay(occD) ? 15 : 10, reason:null, areaId:t.areaId, title:t.title});
  });
  tasks.forEach(t => {
    const mine = completions.filter(c => c.taskId === t.id).sort((a,b) => a.at < b.at ? -1 : 1);
    const last = mine[mine.length-1];
    if(t.id === 't_dishes' || t.id === 't_dog_pm') t.nextDue = localStr(atTime(T, t.time));
    else if(last) t.nextDue = localStr(nextAfterDay(t, parseLocal(last.occurrence)));
    else t.nextDue = localStr(firstOccurrence(t, now));
    if(last){ t.lastDoneAt = last.at; t.lastDoneBy = last.memberId; }
    if(t.cadence === 'daily' && last){
      const days = [...new Set(mine.map(c => dayKey(new Date(c.at))))].sort();
      let count = 1;
      for(let i = days.length-1; i > 0; i--){ if(dayKey(addDays(parseLocal(days[i]+'T12:00'), -1)) === days[i-1]) count++; else break; }
      t.streak = {count, lastDay: days[days.length-1]};
    }
  });
  const ws = startOfWeek(now);
  const firstThisWeek = completions.filter(c => new Date(c.at) >= ws).sort((a,b)=> a.at < b.at ? -1 : 1)[0];
  const badges = firstThisWeek ? [{id:'week-started', unlockedAt:firstThisWeek.at, memberId:firstThisWeek.memberId, taskId:firstThisWeek.taskId}] : [];
  return {members, areas, tasks, completions, badges};
}

async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:{apikey:SB_KEY, 'Content-Type':'application/json'}, body: JSON.stringify(args)});
  const text = await r.text(); let body = null;
  try{ body = text ? JSON.parse(text) : null; }catch(e){ body = null; }
  if(!r.ok){ const err = new Error((body && body.message) || r.statusText || 'Request failed'); err.status = r.status; err.code = body && body.code; throw err; }
  return body;
}
function enqueue(op){
  outbox = outbox.filter(o => o.path !== op.path);
  outbox.push(op); saveOutbox(); flush();
}
let flushing = false, flushTimer = null;
async function flush(){
  if(flushing || !hhKey || st.badKey) return;
  flushing = true;
  try{
    while(outbox.length){
      const op = outbox[0];
      const drop = () => { const i = outbox.indexOf(op); if(i >= 0){ outbox.splice(i, 1); saveOutbox(); } };
      try{
        if(op.op === 'put') await rpc('ml_put', {p_key:hhKey, p_coll:op.coll, p_id:op.id, p_data:op.data});
        else await rpc('ml_remove', {p_key:hhKey, p_coll:op.coll, p_id:op.id});
        drop();
        if(st.offline){ st.offline = false; scheduleRender(); }
      }catch(e){
        if(e.code === '28000'){ st.badKey = true; render(); return; }
        if(e.status && e.status >= 400 && e.status < 500){ drop(); toast('One change couldn\'t be saved and was skipped.'); continue; }
        st.offline = true; scheduleRender();
        clearTimeout(flushTimer); flushTimer = setTimeout(flush, 8000);
        return;
      }
    }
  } finally { flushing = false; }
}

function reload(){
  if(!hhKey) return Promise.resolve();
  if(loading) return loading;
  loading = (async () => {
    try{
      const res = await rpc('ml_load', {p_key: hhKey});
      st.household = res.household || null;
      const fresh = {}; COLLS.forEach(c => fresh[c] = {});
      (res.docs || []).forEach(d => { if(fresh[d.coll] && d.data) fresh[d.coll][d.id] = {...d.data, id:d.id}; });
      applyOutboxTo(fresh);
      COLLS.forEach(c => st[c] = fresh[c]);
      st.mode = 'cloud'; st.offline = false; st.badKey = false; lastLoad = Date.now();
      saveCache(); startRealtime(); flush();

let sbc = null, chan = null, chanTopic = null;
function startRealtime(){
  if(!window.supabase || !st.household || !st.household.topic) return;
  if(chan && chanTopic === st.household.topic) return;
  try{
    sbc = sbc || window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
    if(chan) sbc.removeChannel(chan);
    chanTopic = st.household.topic;
    chan = sbc.channel(chanTopic)
      .on('broadcast', {event:'doc'}, msg => applyRemote(msg && msg.payload))
      .subscribe(status => {
        const was = st.live; st.live = status === 'SUBSCRIBED';
        if(st.live && !was && Date.now() - lastLoad > 5000) reload();
        if(was !== st.live) scheduleRender();
      });
  }catch(e){ chan = null; chanTopic = null; }
}
function applyRemote(p){
  if(!p || !COLLS.includes(p.coll) || !p.id) return;
  if(outbox.some(o => o.path === p.coll + '/' + p.id)) return;
  if(p.deleted) delete st[p.coll][p.id];
  else if(p.data) st[p.coll][p.id] = {...p.data, id:p.id};
  saveCache(); scheduleRender();
}

const POINTS = 10, ON_TIME = 5;
function guardWrite(){ if(!st.canWrite){ toast('This home is read-only for you.'); return false; } return true; }
function defaultDoer(t){ const me = meId(); if(me) return me; return (t.assigneeIds||[]).find(id => st.members[id]) || (members()[0]||{}).id; }

function completeTask(taskId, memberId){
  if(!guardWrite()) return;
  const t = st.tasks[taskId]; if(!t) return;
  const now = new Date(); const prev = {...t};
  const occ = parseLocal(t.nextDue) || now;
  const onTime = now <= endOfDay(occ);
  const points = POINTS + (onTime ? ON_TIME : 0);
  const c = {id:newId('c'), taskId, memberId, at:now.toISOString(), occurrence:t.nextDue, kind:'done', onTime, points, reason:null, areaId:t.areaId, title:t.title};
  const next = {...t, nextDue: localStr(rollForward(t, now)), snoozedUntil:null, lastDoneAt:c.at, lastDoneBy:memberId};
  if(t.cadence === 'daily') next.streak = bumpStreak(t, now, true);
  put('completions', c); put('tasks', next);
  const fresh = checkBadges(c, now, memberId);
  celebrate({t, memberId, points, onTime, fresh, undo: () => undoAction(c.id, prev, fresh)});
  render();
}
function skipTask(taskId, reason){
  if(!guardWrite()) return;
  const t = st.tasks[taskId]; if(!t) return;
  const now = new Date(); const prev = {...t}; const by = defaultDoer(t);
  const c = {id:newId('c'), taskId, memberId:by, at:now.toISOString(), occurrence:t.nextDue, kind:'skip', onTime:null, points:0, reason:String(reason).slice(0,140), areaId:t.areaId, title:t.title};
  const next = {...t, nextDue: localStr(rollForward(t, now)), snoozedUntil:null};
  if(t.cadence === 'daily') next.streak = bumpStreak(t, now, false);
  put('completions', c); put('tasks', next);
  const fresh = checkBadges(c, now, by, ['clear-day']);
  toast(`Skipped this one. Next: ${dueLabel(next, now).text.toLowerCase()}.`, {undo: () => undoAction(c.id, prev, fresh)});
  render();
}
function bumpStreak(t, now, done){
  const today = dayKey(now), yest = dayKey(addDays(startOfDay(now), -1));
  const s = t.streak || {count:0, lastDay:null};
  if(s.lastDay === today) return s;
  if(s.lastDay === yest) return done ? {count:(s.count||0)+1, lastDay:today} : {count:s.count||0, lastDay:today};
  return done ? {count:1, lastDay:today} : s;
}
function undoAction(cid, prevTask, fresh){
  del('completions', cid); put('tasks', prevTask);
  (fresh||[]).forEach(b => del('badges', b.id));
  toast('Undone.'); render();
}
function snoozeTask(taskId, until){
  if(!guardWrite()) return;
  const t = st.tasks[taskId]; if(!t) return;
  put('tasks', {...t, snoozedUntil: localStr(until)});
  toast(`Snoozed until ${fmtTime(until)}.`); render();
}
function saveTask(data, existing){
  if(!guardWrite()) return null;
  const now = new Date();
  const base = existing ? {...existing} : {id:newId('t'), archived:false, createdAt:localStr(now), lastDoneAt:null, lastDoneBy:null, streak:null, snoozedUntil:null};
  const t = {...base, ...data};
  const schedChanged = !existing || ['cadence','time','dayOfMonth'].some(k => existing[k] !== t[k]) || JSON.stringify([...(existing.weekdays||[])].sort()) !== JSON.stringify([...(t.weekdays||[])].sort());
  if(schedChanged){ t.nextDue = localStr(firstOccurrence(t, now)); t.snoozedUntil = null; }
  if(t.cadence !== 'daily') t.streak = null;
  put('tasks', t); render();
  return t;
}

let view = {name:'home'};
const stack = [];
const TAB_OF = {home:'home', area:'home', task:'home', about:'home', prompts:'prompts', people:'people', rewards:'rewards'};
function go(v, opts={}){
  if(opts.tab){ stack.length = 0; }

}
function goBack(){
  const prev = stack.pop() || {name:'home'};

}

function render(){

  if(st.noKey || st.badKey){ app.innerHTML = viewLink(); tb.innerHTML = ''; bindLinkForm(); return; }
  if(st.mode === 'loading' || !isReady()){ app.innerHTML = viewLoading(); tb.innerHTML = ''; return; }

  let html;

    case 'area': html = viewArea(view.id); break;

function snoozeSheet(id){
  const t = st.tasks[id]; if(!t) return;
  const now = new Date(); const e = effDue(t); const floor = e > now ? e : now;
  const end = atTime(now, '23:30');
  const opts = [];
  const add = (label, d) => { if(d > floor && d <= end && sameDay(d, now) && !opts.some(o => fmtTime(o.d) === fmtTime(d))) opts.push({label, d}); };
  const roundUp = d => { const x = new Date(d); x.setMinutes(Math.ceil(x.getMinutes()/15)*15, 0, 0); return x; };
  add('In an hour', roundUp(new Date(now.getTime() + 36e5)));
  add('In 3 hours', roundUp(new Date(now.getTime() + 3*36e5)));
  add('This evening', atTime(now, '19:00'));
  add('Tonight', atTime(now, '21:30'));
  add('Last thing', atTime(now, '23:00'));
  opts.sort((a,b) => a.d - b.d);
  const html = `<h2>Snooze until later today</h2><p class="lede">${esc(t.title)} comes back as due at the time you pick. Tomorrow it counts as waiting again.</p>
    ${opts.length ? `<div class="quick">${opts.map((o,i) => `<button class="btn" data-snz="${i}">${I.clock}${esc(o.label)} · ${fmtTime(o.d)}</button>`).join('')}</div>` : `<p class="calm">It's too late in the day to snooze. Skip this one instead, or leave it for the morning.</p>`}
    <div class="sheet-actions"><button class="btn" data-act="close-sheet">Cancel</button></div>`;
  openSheet(html);
  sheetRoot.querySelectorAll('[data-snz]').forEach(b => b.addEventListener('click', () => { const o = opts[+b.dataset.snz]; closeSheet(); snoozeTask(id, o.d); }));
}
function skipSheet(id){

  const reasons = ['Away from home','Not needed this time','Did it another way','Too unwell'];
  const html = `<h2>Skip this one</h2><p class="lede">${esc(t.title)} moves to its next date. No points, nothing lost. A short reason helps the other person know what happened.</p>
  <form class="form" novalidate>
    <div class="chips">${reasons.map((r,i) => `<label class="chip plain"><input type="radio" name="r" id="f-r-${i}" value="${esc(r)}"><span>${esc(r)}</span></label>`).join('')}</div>
    <div class="field"><label for="f-reason">Or in your words</label><input class="input" id="f-reason" name="reason" maxlength="140" placeholder="Rained off, will do it Monday" autocomplete="off"></div>

  const html = `<h2>${existing ? 'Edit area' : 'Add an area'}</h2>
  <form class="form" novalidate>
    ${existing ? '' : `<div class="chips">${[['School run','bag','sky'],['Admin','doc','slate'],['Laundry','shirt','rose']].map(([n,ic,c]) => `<button type="button" class="btn small soft" data-preset="${esc(n)}" data-ic="${ic}" data-c="${c}">${esc(n)}</button>`).join('')}</div>`}
    <div class="field"><label for="f-aname">Name</label><input class="input" id="f-aname" name="name" value="${esc(a.name)}" maxlength="30" autocomplete="off" required></div>
    <div class="field"><label for="f-apur">What it's for</label><input class="input" id="f-apur" name="purpose" value="${esc(a.purpose)}" maxlength="90" autocomplete="off" placeholder="One line, so everyone knows what belongs here"></div>
    <div class="field"><span class="label" id="acol-l">Colour</span><div class="swatches" role="radiogroup" aria-labelledby="acol-l">${HUES.map(h => `<label class="swatch" style="--c:var(--h-${h})"><input type="radio" name="color" id="f-acol-${h}" value="${h}" ${hue(a.color)===h?'checked':''} aria-label="${h}"><span></span></label>`).join('')}</div></div>
    <div class="field"><span class="label" id="aic-l">Icon</span><div class="chips iconpick" role="radiogroup" aria-labelledby="aic-l">${AREA_ICONS.map(k => `<label class="chip"><input type="radio" name="icon" id="f-aic-${k}" value="${k}" ${a.icon===k?'checked':''} aria-label="${k}"><span>${I[k]}</span></label>`).join('')}</div></div>
    <p class="err" id="f-err" hidden></p>
    <div class="sheet-actions"><button type="button" class="btn" data-act="close-sheet">Cancel</button><button type="submit" class="btn primary">${existing ? 'Save' : 'Add area'}</button></div>
    ${existing && existing.custom ? `<button type="button" class="linkish" data-act="delete-area" data-id="${esc(existing.id)}">Delete this area</button>` : ''}
  </form>`;
  openSheet(html, form => {
    const name = String(form.querySelector('#f-aname').value||'').trim();
    if(!name){ const e = form.querySelector('#f-err'); e.textContent = 'Give the area a name.'; e.hidden = false; return; }
    const obj = {...(existing || {id:newId('a'), order: areas().length+1, custom:true}), name, purpose:String(form.querySelector('#f-apur').value||'').trim(), color: hue((form.querySelector('input[name=color]:checked')||{}).value), icon: (form.querySelector('input[name=icon]:checked')||{}).value || 'house'};
    put('areas', obj); closeSheet();
    if(!existing) go({name:'area', id:obj.id}); else render();
  });
  sheetRoot.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    sheetRoot.querySelector('#f-aname').value = b.dataset.preset;
    const p = {'School run':'Getting everyone out the door and back again.','Admin':'Bills, forms, renewals and the post.','Laundry':'Washing, drying, folding, putting away.'}[b.dataset.preset];
    sheetRoot.querySelector('#f-apur').value = p || '';
    const c = sheetRoot.querySelector('#f-acol-' + b.dataset.c); if(c) c.checked = true;
    const ic = sheetRoot.querySelector('#f-aic-' + b.dataset.ic); if(ic) ic.checked = true;
  }));
}
let askedWho = false;
function maybeAskWho(){
  if(askedWho || sheetRoot.innerHTML || meId() || members().length === 0 || !isReady() || isEmptyHome()) return;
  askedWho = true; setTimeout(() => { if(!meId() && !sheetRoot.innerHTML) pickMeSheet(true); }, 400);
}
function pickMeSheet(first, thenPush){
  const html = `<h2>Who's using this phone?</h2><p class="lede">${first ? 'So Done credits the right person, and this phone gets that person\'s reminders. You can change it on the People page.' : 'Done credits this person, and this phone gets their reminders.'}</p>
    <div class="quick">${members().map(m => `<button class="btn" data-me="${esc(m.id)}" style="justify-content:flex-start">${avatar(m)}${esc(m.name)}</button>`).join('')}</div>
    <div class="sheet-actions"><button class="btn" data-act="close-sheet">${first ? 'Ask me later' : 'Cancel'}</button></div>`;
  openSheet(html);
  sheetRoot.querySelectorAll('[data-me]').forEach(b => b.addEventListener('click', () => {
    setMe(b.dataset.me); closeSheet();
    if(thenPush) { enablePush(); return; }
    if(first && st.push === 'off' && !ls.get(LS_PUSH_ASKED)) remindersSheet(b.dataset.me);
    else toast(`This phone is ${memberName(b.dataset.me)}'s.`);
  }));
}
function remindersSheet(mid){
  const name = memberName(mid);
  openSheet(`<h2>Remind ${esc(name)} on this phone?</h2>
    <p class="lede">Mental Load can ping this phone when one of ${esc(name)}'s jobs comes due, and at 08:00 if anything is still waiting from yesterday. Android will ask you to allow notifications.</p>
    <div class="sheet-actions"><button class="btn" data-act="push-later">Not now</button><button class="btn primary" data-act="push-yes">Turn on reminders</button></div>`);
}
function blankSetupSheet(){
  const html = `<h2>Who lives here?</h2><p class="lede">Two names to start. Add more people later on the People page.</p>
  <form class="form" novalidate>
    <div class="two"><div class="field"><label for="f-p1">First person</label><input class="input" id="f-p1" maxlength="30" autocomplete="off"></div>
    <div class="field"><label for="f-p2">Second person</label><input class="input" id="f-p2" maxlength="30" autocomplete="off"></div></div>
    <p class="err" id="f-err" hidden></p>
    <div class="sheet-actions"><button type="button" class="btn" data-act="close-sheet">Cancel</button><button type="submit" class="btn primary">Set up the home</button></div>
  </form>`;
  openSheet(html, form => {
    const names = ['#f-p1','#f-p2'].map(s => String(form.querySelector(s).value||'').trim()).filter(Boolean);
    if(!names.length){ const e = form.querySelector('#f-err'); e.textContent = 'Add at least one name.'; e.hidden = false; return; }
    DEFAULT_AREAS.forEach(a => put('areas', {...a, custom:false}));
    names.forEach((n,i) => put('members', {id:newId('m'), name:n, initial:n[0].toUpperCase(), color:['teal','plum'][i], order:i+1}));
    closeSheet(); view = {name:'home'}; render();
  });
}
async function wipeHome(){
  try{ await rpc('ml_clear_home', {p_key: hhKey}); }
  catch(e){ toast('Couldn\'t clear the home. Check your connection and try again.'); return; }
  outbox = []; saveOutbox();
  COLLS.forEach(c => st[c] = {}); saveCache();
  ls.del(LS_ME); askedWho = false;
  view = {name:'home'}; stack.length = 0; render(); reload();
}
async function loadExample(){
  const seed = buildSeed(new Date()); const docs = [];
  COLLS.forEach(c => seed[c].forEach(x => { const {id, ...data} = x; docs.push({coll:c, id, data}); }));
  try{ await rpc('ml_put_many', {p_key: hhKey, p_docs: docs}); }
  catch(e){ toast('Couldn\'t set up the example home. Check your connection and try again.'); return; }
  view = {name:'home'}; await reload();
}
function bindLinkForm(){
  const f = document.getElementById('link-form'); if(!f) return;
  f.addEventListener('submit', e => {
    e.preventDefault();
    const v = f.querySelector('#f-link').value;
    if(!linkHousehold(v)){ const err = f.querySelector('#f-err'); err.textContent = 'That doesn\'t look like a Mental Load link. It ends with #k= and a long code.'; err.hidden = false; }
  });
}

/* =====================================================================
   Toasts and celebration
   ===================================================================== */
const toastRoot = document.getElementById('toast-root');
let toastTimer = null;
function toast(msg, opts={}){
  clearTimeout(toastTimer);
  toastRoot.innerHTML = `<div class="toast" role="status"><div class="txt"><strong>${esc(msg)}</strong></div>${opts.undo ? '<button id="toast-undo">Undo</button>' : ''}</div>`;
  if(opts.undo){ const u = toastRoot.querySelector('#toast-undo'); u.addEventListener('click', () => { clearTimeout(toastTimer); toastRoot.innerHTML = ''; opts.undo(); }); }
  toastTimer = setTimeout(() => { toastRoot.innerHTML = ''; }, opts.undo ? 5500 : 2800);
}
function celebrate({t, memberId, points, onTime, fresh, undo}){
  clearTimeout(toastTimer);
  const m = st.members[memberId]; const h = hue(m && m.color);
  const sparks = Array.from({length:8}, (_,i) => { const a = i/8*Math.PI*2; return `<i style="--x:${Math.round(Math.cos(a)*30)}px;--y:${Math.round(Math.sin(a)*30)}px"></i>`; }).join('');
  const badgeLine = fresh && fresh.length ? `New badge: ${fresh.map(b => b.name).join(', ')}` : (onTime ? `+${points} points, on time` : `+${points} points`);
  toastRoot.innerHTML = `<div class="toast" role="status"><span class="burst" style="--c:var(--h-${h})">${sparks}${I.check}</span><div class="txt"><strong>${esc(t.title)} done by ${esc(m ? m.name : 'someone')}</strong><small>${esc(badgeLine)}</small></div><button id="toast-undo">Undo</button></div>`;
  toastRoot.querySelector('#toast-undo').addEventListener('click', () => { clearTimeout(toastTimer); toastRoot.innerHTML = ''; undo(); });
  toastTimer = setTimeout(() => { toastRoot.innerHTML = ''; }, 5500);
}

/* =====================================================================
   Reminders (web push), install, household link
   ===================================================================== */
function b64uToBytes(s){ const pad = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + pad).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
const swReady = () => Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('no service worker')), 6000))]);
async function refreshPushState(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){ st.push = 'unsupported'; scheduleRender(); return; }
  if(Notification.permission === 'denied'){ st.push = 'denied'; scheduleRender(); return; }
  try{ const reg = await swReady(); const sub = await reg.pushManager.getSubscription(); st.push = (sub && Notification.permission === 'granted') ? 'on' : 'off'; }
  catch(e){ st.push = 'off'; }
  scheduleRender();
}
async function registerSub(sub, member){
  const j = sub.toJSON();
  await rpc('ml_subscribe', {p_key:hhKey, p_member:member, p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth});
}
async function resubscribeFor(member){
  try{ const reg = await swReady(); const sub = await reg.pushManager.getSubscription(); if(sub) await registerSub(sub, member); }catch(e){}
}
async function testPush(){
  try{
    const reg = await swReady(); const sub = await reg.pushManager.getSubscription(); if(!sub) return 'off';
    const r = await fetch(FN_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'test', key:hhKey, endpoint:sub.endpoint})});
    const j = await r.json().catch(() => ({}));
    return j.result || 'err';
  }catch(e){ return 'err'; }
}
async function enablePush(){
  const me = meId();
  if(!me){ pickMeSheet(false, true); return; }
  if(st.push === 'unsupported'){ toast('This browser can\'t show reminders. Open Mental Load in Chrome.'); return; }
  let perm = Notification.permission;
  if(perm === 'default'){ try{ perm = await Notification.requestPermission(); }catch(e){ perm = 'denied'; } }
  ls.set(LS_PUSH_ASKED, '1');
  if(perm !== 'granted'){ await refreshPushState(); toast('Reminders stay off. You can turn them on from Prompts.'); return; }
  try{
    const reg = await swReady();
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: b64uToBytes(VAPID_PUBLIC)});
    await registerSub(sub, me);
    st.push = 'on'; render();
    const r = await testPush();
    toast(r === 'ok' ? `Reminders are on for ${memberName(me)}. A test ping is on its way.` : `Reminders are on for ${memberName(me)}.`);
  }catch(e){
    toast('Couldn\'t turn on reminders. Check your connection and try again.');
    refreshPushState();
  }
}
async function disablePush(){
  try{
    const reg = await swReady(); const sub = await reg.pushManager.getSubscription();
    if(sub){ await rpc('ml_unsubscribe', {p_key:hhKey, p_endpoint:sub.endpoint}).catch(() => {}); await sub.unsubscribe(); }
  }catch(e){}
  st.push = 'off'; render(); toast('Reminders are off on this phone.');
}

let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; scheduleRender(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Installed. Mental Load is on your home screen.'); scheduleRender(); });
function standalone(){ try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }catch(e){ return false; } }
async function doInstall(){
  if(!installEvt){ toast('In Chrome, tap the ⋮ menu, then Install app.'); return; }
  const ev = installEvt; installEvt = null;
  try{ ev.prompt(); await ev.userChoice; }catch(e){}
  render();
}

function householdLink(){ return `${location.origin}${location.pathname}#k=${hhKey}`; }
function qrSvg(text){
  try{ const q = window.qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:2, scalable:true}); }catch(e){ return ''; }
}
async function shareLink(){
  const url = householdLink();
  if(navigator.share){ try{ await navigator.share({title:'Mental Load', text:'Our home in Mental Load. Open this on your phone:', url}); return; }catch(e){ if(e && e.name === 'AbortError') return; } }
  copyLink();
}
async function copyLink(){
  try{ await navigator.clipboard.writeText(householdLink()); toast('Link copied.'); }
  catch(e){ toast('Press and hold the link to copy it.'); }
}
function readKeyFromUrl(){
  const m = /(?:^#|&)k=([A-Za-z0-9_-]{24,})/.exec(location.hash || '');
  if(!m) return null;
  history.replaceState(null, '', location.pathname + location.search);
  return m[1];
}
function applyHash(h){
  let m;
  if((m = /^#task-([A-Za-z0-9_.:-]+)$/.exec(h || ''))){ stack.length = 0; stack.push({name:'home'}); view = {name:'task', id:m[1]}; }
  else if(h === '#prompts'){ stack.length = 0; view = {name:'prompts'}; }
  else return false;
  render(); window.scrollTo(0, 0); return true;
}
function linkHousehold(raw){
  const m = /k=([A-Za-z0-9_-]{24,})/.exec(String(raw || '')) || /^\s*([A-Za-z0-9_-]{24,})\s*$/.exec(String(raw || ''));
  if(!m) return false;
  startWithKey(m[1]);
  return true;
}
function startWithKey(key){
  const prev = ls.get(LS_KEY);
  if(prev && prev !== key){ ls.del(LS_CACHE); outbox = []; saveOutbox(); ls.del(LS_ME); COLLS.forEach(c => st[c] = {}); st.household = null; st.mode = 'loading'; }
  hhKey = key; ls.set(LS_KEY, key);
  st.noKey = false; st.badKey = false;
  render(); reload(); refreshPushState();
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case 'go': go({name: el.dataset.view, id}); break;
    case 'go-tab': go({name: el.dataset.view}, {tab:true}); break;
    case 'back': goBack(); break;
    case 'close-sheet': closeSheet(); break;
    case 'quick-done': { const t = st.tasks[id]; if(t) completeTask(id, defaultDoer(t)); break; }
    case 'done-detail': { const r = document.querySelector('input[name="doneby"]:checked'); const t = st.tasks[id]; if(t) completeTask(id, r ? r.value : defaultDoer(t)); break; }
    case 'snooze': if(guardWrite()) snoozeSheet(id); break;
    case 'skip': if(guardWrite()) skipSheet(id); break;
    case 'add-task': if(guardWrite()) taskForm(null, {areaId: el.dataset.area}); break;
    case 'starter': { const s = (STARTERS[el.dataset.area] || STARTERS._)[+el.dataset.i]; if(s && guardWrite()) taskForm(null, {areaId: el.dataset.area, title:s[0], cadence:s[1], time:s[2], minutes:s[3]}); break; }
    case 'edit-task': if(st.tasks[id] && guardWrite()) taskForm(st.tasks[id]); break;
    case 'archive': { const t = st.tasks[id]; if(!t || !guardWrite()) break; closeSheet(); put('tasks', {...t, archived:true, snoozedUntil:null}); toast(`${t.title} archived. Its history is kept.`); if(view.name === 'task') goBack(); else render(); break; }
    case 'restore': { const t = st.tasks[id]; if(!t || !guardWrite()) break; const now = new Date(); put('tasks', {...t, archived:false, nextDue: localStr(firstOccurrence(t, now))}); toast(`${t.title} is back.`); render(); break; }
    case 'delete-task': { const t = st.tasks[id]; if(!t || !guardWrite()) break; closeSheet();
      confirmSheet({title:`Delete ${t.title}?`, body:'This removes the routine for good. Its past entries stay in the log under its old name. Archive instead if you might want it back.', confirm:'Delete for good', danger:true, onYes: () => { del('tasks', id); toast('Deleted.'); if(view.name === 'task' && view.id === id) goBack(); else render(); }}); break; }
    case 'edit-area': if(st.areas[id] && guardWrite()) areaForm(st.areas[id]); break;
    case 'add-area': if(guardWrite()) areaForm(null); break;
    case 'delete-area': { const a = st.areas[id]; if(!a) break; closeSheet();
      const n = Object.values(st.tasks).filter(t => t.areaId === id).length;
      if(n){ toast(`Move or delete the ${n} routine${n===1?'':'s'} in ${a.name} first.`); break; }
      confirmSheet({title:`Delete ${a.name}?`, body:'The area is empty, so nothing else changes.', confirm:'Delete area', danger:true, onYes: () => { del('areas', id); stack.length = 0; view = {name:'home'}; render(); }}); break; }
    case 'add-member': if(guardWrite()) memberForm(null); break;
    case 'edit-member': if(st.members[id] && guardWrite()) memberForm(st.members[id]); break;
    case 'remove-member': { const m = st.members[id]; if(!m) break; closeSheet();
      const n = activeTasks().filter(t => (t.assigneeIds||[]).includes(id)).length;
      if(n){ toast(`Reassign ${m.name}'s ${n} routine${n===1?'':'s'} first.`); break; }
      confirmSheet({title:`Remove ${m.name}?`, body:'They leave the home. Past jobs they did stay in the log.', confirm:'Remove', danger:true, onYes: () => { del('members', id); if(ls.get(LS_ME) === id) ls.del(LS_ME); render(); }}); break; }
    case 'pick-me': pickMeSheet(false); break;
    case 'pfilter': ls.set(LS_FILTER, el.dataset.v); render(); break;
    case 'enable-push': enablePush(); break;
    case 'push-yes': closeSheet(); enablePush(); break;
    case 'push-later': closeSheet(); ls.set(LS_PUSH_ASKED, '1'); toast('You can turn reminders on later from Prompts.'); break;
    case 'disable-push': disablePush(); break;
    case 'test-push': testPush().then(r => toast(r === 'ok' ? 'Test sent. It should arrive in a few seconds.' : r === 'gone' ? 'This phone\'s reminders expired. Turn them on again.' : 'Couldn\'t send a test. Check your connection.')).then(() => refreshPushState()); break;
    case 'install': doInstall(); break;
    case 'share-link': shareLink(); break;
    case 'copy-link': copyLink(); break;
    case 'retry': st.offline = false; render(); reload(); break;
    case 'reset': if(!guardWrite()) break; confirmSheet({title:'Clear this home?', body:'Every person, area, routine, log entry and badge goes, on every phone that shares it. This can\'t be undone.', confirm:'Clear everything', danger:true, onYes: wipeHome}); break;
    case 'setup-example': if(guardWrite()) loadExample(); break;
    case 'setup-blank': if(guardWrite()) blankSetupSheet(); break;
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && sheetRoot.innerHTML) closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  if(hhKey && Date.now() - lastLoad > 20000) reload();
  flush(); refreshPushState(); render();
});
window.addEventListener('online', () => { flush(); reload(); });
window.addEventListener('load', () => startRealtime());
setInterval(() => {
  if(document.hidden) return;
  if(hhKey && Date.now() - lastLoad > 180000) reload();
  else if(!sheetRoot.innerHTML) render();
}, 60000);

/* hook for automated checks */
window.__ml = {buildSeed, nextAfterDay, firstOccurrence, rollForward, statusOf, parseLocal, localStr, cadenceText, promptMessage, st, completeTask, skipTask, snoozeTask, checkBadges, fairness, activeStreak, reload, outbox: () => outbox};

/* boot: key from the link, cached copy first, then the live household */
(function boot(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').then(() => refreshPushState()).catch(() => { st.push = 'unsupported'; });
    navigator.serviceWorker.addEventListener('message', e => {
      if(e.data && e.data.type === 'open'){ try{ applyHash(new URL(e.data.url).hash); }catch(err){} }
    });
  } else st.push = 'unsupported';
  const fromUrl = readKeyFromUrl();
  if(fromUrl){ startWithKey(fromUrl); }
  else {
    hhKey = ls.get(LS_KEY);
    if(!hhKey){ st.noKey = true; render(); return; }
    try{
      const c = JSON.parse(ls.get(LS_CACHE) || 'null');
      if(c && c.members){ COLLS.forEach(k => st[k] = c[k] || {}); st.household = c.household || null; applyOutboxTo(st); st.mode = 'cloud'; }
    }catch(e){}
    if(location.hash){ applyHash(location.hash); history.replaceState(null, '', location.pathname + location.search); }
    render(); reload();
  }
  if(location.hash && !/k=/.test(location.hash)){ applyHash(location.hash); history.replaceState(null, '', location.pathname + location.search); }
})();
})();
</script>
